<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BACA!! - GoostTeam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #e2e8f0; background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 20px 20px; }
        .brutal-shadow { box-shadow: 6px 6px 0px 0px rgba(0,0,0,1); }
        .brutal-border { border: 3px solid black; }
    </style>
</head>
<body class="font-mono p-4">
    <header class="max-w-md mx-auto flex justify-between items-center mb-6">
        <div class="bg-black text-[#bef264] px-4 py-2 font-black italic transform -skew-x-12">BACA!!</div>
        <a href="index.html" class="bg-white px-3 py-1 font-black text-xs border-2 border-black brutal-shadow uppercase"><< Kembali</a>
    </header>
    <main class="max-w-md mx-auto bg-white brutal-border brutal-shadow p-6 space-y-4">
        <h2 class="font-black border-b-4 border-black pb-2 uppercase text-xl">Protokol Eksekusi</h2>
        <div class="space-y-4 text-xs">
            <div class="flex gap-4">
                <span class="font-black text-2xl text-gray-300">01</span>
                <p><b>Copy Link:</b> Cari video di TikTok/IG, klik share, lalu salin tautan.</p>
            </div>
            <div class="flex gap-4">
                <span class="font-black text-2xl text-gray-300">02</span>
                <p><b>Paste:</b> Tempel link di kotak "Target URL" GoostTeam.</p>
            </div>
            <div class="flex gap-4">
                <span class="font-black text-2xl text-gray-300">03</span>
                <p><b>Download:</b> Klik tombol hijau dan tunggu proses ekstraksi video.</p>
            </div>
        </div>
    </main>
    <div class="max-w-md mx-auto mt-6 bg-black p-4 text-[#bef264] text-center font-black text-sm border-4 border-[#bef264] brutal-shadow">
        GOOSTTEAM SYSTEM V.1.0
    </div>
</body>
</html>
